# Copy ONLY this workflow + runner.py + requirements.txt into a separate runner repository.
name: Matsprell Sosial
on:
  workflow_dispatch:
  schedule:
    - cron: '7,17,27,37,47,57 * * * *'
permissions:
  contents: read
concurrency:
  group: matsprell-social
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python runner.py
        env:
          MATSPRELL_ORIGIN: https://www.matsprell.no
          SOCIAL_RUNNER_TOKEN: ${{ secrets.SOCIAL_RUNNER_TOKEN }}
